<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAVADHAN | Community Safety & Crime Prevention</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Leaflet Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        #verification-gate {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        #verification-gate.verified {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        .map-frame-container {
            width: 100%;
            height: 550px;
            border-radius: 2rem;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        #leaflet-map, #sos-leaflet-map {
            width: 100%;
            height: 100%;
            background: #cbd5e1;
        }

        .emergency-btn-active { background-color: #ef4444 !important; color: white !important; }
        .gps-btn-active { background-color: #3b82f6 !important; color: white !important; }

        .chat-panel {
            height: 500px;
            width: 350px;
            max-width: 90vw;
            display: flex;
            flex-direction: column;
        }
        .message-bubble { max-width: 85%; word-wrap: break-word; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .pe_signin_button { display: inline-block; vertical-align: middle; }
    </style>
</head>
<body id="app-body">

    <!-- VERIFICATION GATE OVERLAY -->
    <div id="verification-gate">
        <div class="max-w-md w-full px-6 text-center">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl">
                <div class="w-20 h-20 bg-slate-900 text-white rounded-3xl flex items-center justify-center text-3xl mx-auto mb-6 shadow-xl">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-900 mb-3">Security Access</h2>
                <p class="text-slate-500 mb-8 font-medium">Verify your phone to unlock the Safety Hub.</p>
                
                <div class="pe_signin_button" data-client-id="13401266232106403409">
                    <script src="https://www.phone.email/sign_in_button_v1.js" async></script>
                </div>
                
                <p class="text-[10px] text-slate-400 mt-6 uppercase font-bold">Encrypted Connection</p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="glass-nav fixed top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.switchView('citizen')">
                <div class="bg-slate-900 text-white p-2 rounded-xl">
                    <i class="fas fa-fingerprint text-xl"></i>
                </div>
                <span class="text-2xl font-black tracking-tighter">SAAVADHAN</span>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="window.switchView('le')" class="px-3 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs">LE PORTAL</button>
                <button id="gps-toggle" onclick="window.toggleGpsTracking()" class="px-3 py-2 rounded-xl border-2 border-blue-100 text-blue-600 font-bold text-xs">GPS</button>
                <button id="emergency-toggle" onclick="window.toggleEmergencyMode()" class="px-3 py-2 rounded-xl border-2 border-red-100 text-red-600 font-bold text-xs">SOS</button>
            </div>
        </div>
    </nav>

    <!-- CITIZEN VIEW -->
    <div id="citizen-view" class="block pt-32 pb-20">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-2 gap-12">
            <div class="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100">
                <h2 class="text-3xl font-black mb-6">Safety Map</h2>
                <div class="map-frame-container h-[400px]">
                    <div id="leaflet-map"></div>
                </div>
            </div>
            <div class="bg-slate-900 text-white p-10 rounded-[3rem] shadow-xl flex flex-col justify-center">
                <h2 class="text-3xl font-black mb-4">Volunteer Status</h2>
                <div id="vol-action-container">
                    <button onclick="window.openVolunteerModal()" class="bg-blue-600 px-8 py-4 rounded-2xl font-bold shadow-xl">Join Program</button>
                </div>
                <div id="on-call-status" class="hidden mt-6 flex items-center bg-green-500/10 border border-green-500/20 px-4 py-3 rounded-2xl">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-ping mr-3"></span>
                    <span class="text-sm font-black text-green-400">ON-CALL READY</span>
                </div>
            </div>
        </div>
    </div>

    <!-- OTHER VIEWS -->
    <div id="le-view" class="hidden min-h-screen pt-32 pb-20 px-4 bg-slate-100">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-4xl font-black mb-10">Law Enforcement Portal</h1>
            <div id="le-sos-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <div id="emergency-map-view" class="hidden min-h-screen pt-32 pb-20 px-4 bg-slate-50">
        <div class="max-w-7xl mx-auto h-[70vh]">
            <h1 class="text-2xl font-black mb-6">SOS Command Center</h1>
            <div class="map-frame-container h-full"><div id="sos-leaflet-map"></div></div>
        </div>
    </div>

    <!-- Chat -->
    <div id="chat-widget" class="fixed bottom-6 left-6 flex flex-col items-start z-[100]">
        <div id="chat-panel" class="hidden chat-panel bg-white rounded-[2rem] shadow-2xl border border-slate-200 mb-4 overflow-hidden">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <h4 class="font-black text-xs uppercase tracking-widest">Community Hub</h4>
                <button onclick="window.toggleChat()" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div id="message-container" class="flex-grow overflow-y-auto p-4 space-y-4 scrollbar-hide"></div>
            <div class="p-4 border-t border-slate-100 flex space-x-2 bg-slate-50">
                <input type="text" id="chat-input" placeholder="Message..." class="flex-grow px-4 py-2 rounded-xl bg-white border-none ring-1 ring-slate-200 text-sm outline-none">
                <button onclick="window.sendMessage()" class="bg-slate-900 text-white p-2 rounded-xl w-10 h-10"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        <button onclick="window.toggleChat()" class="bg-slate-900 text-white w-14 h-14 rounded-2xl shadow-2xl flex items-center justify-center text-xl">
            <i class="fas fa-comments"></i>
        </button>
    </div>

    <!-- Modals -->
    <div id="volunteerModal" class="fixed inset-0 z-[110] flex items-center justify-center hidden bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2rem] max-w-lg w-full p-10 shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Register Volunteer</h3>
            <form onsubmit="window.handleRegistration(event)" class="space-y-4">
                <input id="vol-name" type="text" placeholder="Full Name" required class="w-full px-5 py-4 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none">
                <input id="vol-phone" type="tel" placeholder="Phone" required class="w-full px-5 py-4 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none">
                <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black">ACTIVATE</button>
                <button type="button" onclick="window.closeVolunteerModal()" class="w-full text-slate-400 text-sm py-2">Cancel</button>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[120] hidden bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl">
        <span id="toast-msg" class="font-bold text-sm"></span>
    </div>

    <script>
        function phoneEmailListener(userObj){
            document.getElementById('verification-gate').classList.add('verified');
            sessionStorage.setItem('saavadhan_verified', 'true');
            if(window.mapInstance) window.mapInstance.invalidateSize();
            if(window.showToast) window.showToast("Verification Success!");
        }
        window.onload = function() {
            if(sessionStorage.getItem('saavadhan_verified') === 'true') {
                document.getElementById('verification-gate').classList.add('verified');
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot, setDoc, deleteDoc, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Secure Firebase Setup
        let app, auth, db, appId;
        try {
            const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{"apiKey":"","projectId":"saavadhan-default"}';
            const firebaseConfig = typeof configStr === 'string' ? JSON.parse(configStr) : configStr;
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'saavadhan-v1';
        } catch (e) { console.error("Firebase initialization failed:", e); }

        let user = null;
        let map, sosMap;
        const getColl = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);

        // Auth with Exponential Backoff
        const initAuth = async (retries = 5, delay = 1000) => {
            if (!auth) return;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                if (retries > 0) {
                    // console.log(`Auth retry ${6 - retries}...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return initAuth(retries - 1, delay * 2);
                }
                console.error("Firebase Auth Final Error:", err);
                window.showToast("Network Error: Could not connect to security service.");
            }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (u) {
                setupListeners();
                setupMaps();
            }
        });

        const setupListeners = () => {
            if (!user || !db) return;
            
            // SOS Signals Listener
            onSnapshot(getColl('sos_signals'), (snap) => {
                const signals = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderLePortal(signals);
            }, (err) => {
                if (err.code === 'permission-denied') {
                    console.error("Firestore Permission Denied. Ensure rules are deployed.");
                }
            });

            // Community Messages Listener
            onSnapshot(getColl('messages'), (snap) => {
                const msgs = snap.docs.map(d => d.data()).sort((a,b) => (a.sentAt?.seconds || 0) - (b.sentAt?.seconds || 0));
                const container = document.getElementById('message-container');
                if (container) {
                    container.innerHTML = msgs.map(m => `
                        <div class="flex flex-col ${m.uid === user.uid ? 'items-end' : 'items-start'}">
                            <p class="text-[9px] font-black text-slate-400 mb-1 uppercase">${m.name || 'Citizen'}</p>
                            <div class="message-bubble px-4 py-2 rounded-2xl text-sm ${m.uid === user.uid ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'} shadow-sm">
                                ${m.text}
                            </div>
                        </div>
                    `).join('');
                    container.scrollTop = container.scrollHeight;
                }
            }, (err) => console.error("Message Sync Error:", err));
        };

        const setupMaps = () => {
            if (!map) {
                map = L.map('leaflet-map').setView([28.6139, 77.2090], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap'
                }).addTo(map);
                window.mapInstance = map;
            }
        };

        window.toggleEmergencyMode = async () => {
            if (!user || !db) return;
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'sos_signals', user.uid);
            const btn = document.getElementById('emergency-toggle');
            try {
                if (!btn.classList.contains('emergency-btn-active')) {
                    await setDoc(ref, { uid: user.uid, lat: 28.6139, lng: 77.2090, timestamp: Timestamp.now() });
                    btn.classList.add('emergency-btn-active');
                    window.showToast("SOS BROADCAST ACTIVE");
                } else {
                    await deleteDoc(ref);
                    btn.classList.remove('emergency-btn-active');
                    window.showToast("SOS STOPPED");
                }
            } catch (e) {
                window.showToast("Error updating SOS status. Check network.");
                console.error(e);
            }
        };

        window.toggleGpsTracking = () => {
            const btn = document.getElementById('gps-toggle');
            btn.classList.toggle('gps-btn-active');
            window.showToast(btn.classList.contains('gps-btn-active') ? "GPS Active" : "GPS Off");
        };

        window.sendMessage = async () => {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !user || !db) return;
            try {
                await addDoc(getColl('messages'),
